site_name: Kamanberr Ocean Database
site_description: Download routes of various open-access oceanographic datasets
site_author: Jiuk Hwang
site_url: https://kamanberr.github.io/ocean-database/
repo_url: https://github.com/kamanberr/ocean-database
repo_name: kamanberr/ocean-database
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Jiuk Hwang (Kamanberr)

theme:
  name: material
  language: en
  icon:
    logo: material/waves
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
          site_description: 다양한 공개 해양 자료의 다운로드 경로 모음
          nav_translations:
            Home: 홈
            Whole Ocean: 전 지구 자료
            Satellite: 위성
            Sea Surface Temperature: 해수면 온도
            Ocean Color: 해색
            Data Portals & Tools: 자료 포털·도구
            PO.DAAC MATLAB Manual: PO.DAAC MATLAB 매뉴얼
            Korea Satellite Centers: 국내 위성 센터
            In Situ: 현장 관측
            Model: 모델
            Atmosphere: 대기
            Processed Product: 가공 자료
            Ocean & Climate Index: 해양·기후 지수
            Sea Level & OHC: 해수면·해양 열용량
            Mixed Layer Depth: 혼합층 깊이
            Topics: 주제별
            Typhoon & Hurricane: 태풍·허리케인
            Nutrient & Carbon Cycle: 영양염·탄소 순환
            Ecological Oceanography: 생태 해양학
            Freshwater / River Discharge: 담수·하천 유출
            Wave: 파랑
            Marine Heat Wave: 해양 열파
            Regional: 지역별
            Korea: 한국
            Japan: 일본
            Pacific Ocean: 태평양
            Atlantic Ocean: 대서양
            Indian Ocean: 인도양
            Bathymetry & Boundary: 수심·경계
            Bathymetry: 수심
            Boundary: 경계
            Etc.: 기타
            Data download with code: 코드로 자료 받기
            Useful MATLAB Code: 유용한 MATLAB 코드
            Data used in papers: 논문에 쓰인 자료
            Image of Ocean: 바다 이미지
            Stommel Diagram: Stommel 다이어그램
            Polar: 극지
            Resources: 참고 자료
            Update Log: 업데이트 기록
            GHRSST: GHRSST
            Ocean Color Download Manual: 해색 자료 지역 다운로드
            GOCI & GOCI-II: GOCI & GOCI-II
            Sea Surface Height & Altimeter: 해수면 높이·고도계
            Current: 해류
            Sea Surface Salinity: 표층 염분
            Microwave (AMSR-2): 마이크로파 (AMSR-2)
            SAR: SAR
            GRACE: GRACE
            Multi-platform archives: 통합 아카이브
            How to download WOD: WOD 다운로드 방법
            Argo: Argo
            Drifter: 뜰개
            How to download GDP data: GDP 자료 다운로드 방법
            CMEMS drifter processing: CMEMS drifter 자료 처리
            Ship: 선박
            Mooring: 계류
            Tide gauge: 조위 관측
            Gridded T/S products: 격자 수온·염분 product
            EN4 download guide: EN4 다운로드 안내
            Other in situ datasets: 기타 현장 관측 자료
            How to download HYCOM: HYCOM 다운로드 방법
            How to download ERA5: ERA5 다운로드 방법
            Volume Transport: 해류 수송량
            In Situ Observations: 실측 관측 자료
            Satellite Observations: 위성 관측 자료
            Fisheries Catch Statistics: 어획량 자료
            NIFS Serial Observation Download: NIFS 정선관측자료 다운로드
            Sea Turtle Tracks: 바다거북 이동경로
            JAMSTEC Model Products: JAMSTEC 모형 산출물
            JODC Data: JODC 자료
            NEAR-GOOS: NEAR-GOOS
            CMEMS / Copernicus: CMEMS / Copernicus

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kamanberr
      name: GitHub
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/kamanberr/
      name: Instagram (update notice)
    - icon: fontawesome/solid/envelope
      link: mailto:hwangjiuk34@gmail.com
      name: Contact

